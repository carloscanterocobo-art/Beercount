<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Registra tus consumiciones y controla tus gastos con Beercount.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Beercount">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Beercount</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Registro del Service Worker de Beercount -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const manifestUrl = new URL(
            'precache_manifest.json',
            document.baseURI
          );

          const response = await fetch(manifestUrl, {
            method: 'HEAD',
            cache: 'no-store'
          });

          // Solo registrar el Service Worker en compilaciones de producción.
          if (response.ok) {
            const workerUrl = new URL(
              'service-worker.js',
              document.baseURI
            );

            await navigator.serviceWorker.register(workerUrl);
            console.log('Beercount: Service Worker registrado.');
          }
        } catch (error) {
          console.error(
            'Beercount: no se pudo registrar el Service Worker.',
            error
          );
        }
      });
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
